
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Portfolio</h1>

<nav>
    <a href="index.html">Home</a>
    <a href="labs.html">Labs & Projects</a>
    <a href="contact.html">Contact</a>
</nav>

    </header>

    
<main class="contact-page">

        <section>
            <h2>Contact Me</h2>

            <p>
                Feel free to contact me using
                the information or form below.
            </p>
        </section>

        <section>
            <h2>Contact Information</h2>

            <p>
                Email:
                <a href="mailto:gwareth@stu.kau.edu.sa">
                    gwareth@stu.kau.edu.sa
                </a>
            </p>

            <p>
                GitHub:
                <a href="https://github.com/joud15">
                    My GitHub Profile
                </a>
            </p>
        </section>

        <section>
            <h2>Send a Message</h2>

            <form action="https://formsubmit.co/gwareth@stu.kau.edu.sa"
                  method="POST">

                <p>
                    <label for="name">Name:</label>
                    <br>
                    <input type="text"
                           id="name"
                           name="name"
                           required>
                </p>

                <p>
                    <label for="email">Email:</label>
                    <br>
                    <input type="email"
                           id="email"
                           name="email"
                           required>
                </p>

                <p>
                    <label for="message">Message:</label>
                    <br>
                    <textarea id="message"
                              name="message"
                              rows="6"
                              required></textarea>
                </p>

                <p>
                    <label>Message Type:</label>
                    <br>

                    <input type="radio"
                           id="inquiry"
                           name="message_type"
                           value="Inquiry"
                           checked>
                    <label for="inquiry">Inquiry</label>

                    <input type="radio"
                           id="feedback"
                           name="message_type"
                           value="Feedback">
                    <label for="feedback">Feedback</label>
                </p>

                <button type="submit">
                    Send Message
                </button>

            </form>
        </section>

    </main>

    <footer>
        <p>CPIT-405 Portfolio</p>
    </footer>

</body>

</html>
